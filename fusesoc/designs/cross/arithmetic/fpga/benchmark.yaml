---
name: arithmetic

parameter_set:
  VARIANT:
    - RSDP
    - RSDPG
  CATEGORY:
    - CATEGORY_1
    - CATEGORY_3
    - CATEGORY_5
  OPTIMIZATION:
    - FAST

# list of modules and their possible parameter configs
modules:
  add_sub_vector:
    - DATA_WIDTH: 64
  exp_vector:
    - IN_DATA_WIDTH: 64
      OUT_DATA_WIDTH: 64
  mul_vector_matrix:
    - VEC_DATA_WIDTH: 64
      MAT_DATA_WIDTH: 192
      RES_DATA_WIDTH: 64
      FZ: 0
    - VEC_DATA_WIDTH: 64
      MAT_DATA_WIDTH: 192
      RES_DATA_WIDTH: 64
      FZ: 1
  mul_vector:
    - DATA_WIDTH: 64
  arithmetic_unit:
    - STREAM_WIDTH: 64
      MAT_DATA_WIDTH: 712

# template command for performance and resource DSE
resources:
  cmd_template: >-
    fusesoc run --build --build-root '${build_dir}' --target synth cross:arithmetic:${module} ${parameter_set} ${extra_args} --jobs ${jobs} --part ${part}
  parts:
    xc7a200tffg1156-3:
      clock:
        interval:
          - 50
          - 300
        resolution: 1
performance:
  cmd_template: >-
    TB_ITERATIONS=1 fusesoc run --build-root '${build_dir}' --target sim cross:arithmetic:'${module}'
