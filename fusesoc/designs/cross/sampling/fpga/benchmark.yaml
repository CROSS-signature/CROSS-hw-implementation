---
name: sampling

parameter_set:
  VARIANT:
    - RSDP
    - RSDPG
  CATEGORY:
    - CATEGORY_1
    - CATEGORY_3
    - CATEGORY_5
  OPTIMIZATION:
    - FAST
    - BALANCED
    - SMALL

# list of modules and their possible parameter configs
modules:
  sample_unit:
    - KECCAK_UNROLL_FACTOR: 1
    - KECCAK_UNROLL_FACTOR: 2

# template command for performance and resource DSE
resources:
  cmd_template: fusesoc run --build --build-root '${build_dir}' --target synth cross:sampling:${module} ${parameter_set} ${extra_args} --jobs ${jobs} --part ${part}
  parts:
    xc7a200tffg1156-3:
      clock:
        interval:
          - 50
          - 300
        resolution: 1
